name: build

on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    services:
      # Integration tests use these brokers (see KAFKA_BOOTSTRAP / RABBITMQ_*
      # env below). Without them the test mains silently skip, which used to
      # leave Sonar with unit-test coverage only.
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: rc-ci-cluster
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      KAFKA_BOOTSTRAP: localhost:9092
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_MGMT_PORT: "15672"
    steps:
      - name: Generate a token
        id: generate_token
        if: github.ref == 'refs/heads/main'
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.APP_ID_ADMIN_GITHUB }}
          private_key: ${{ secrets.APP_PRIVATE_KEY_ADMIN_GITHUB }}
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.ref != 'refs/heads/main'

      - name: Verify Conventional Commits
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up NodeJS
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Set up Semantic Release
        if: github.ref == 'refs/heads/main'
        run: npm -g install --ignore-scripts @semantic-release/git semantic-release@23.0.0

      # Run the globally installed binary directly instead of `npx`, which can
      # fetch packages on-demand and run their lifecycle scripts (S6505).
      - name: Semantic Release
        if: github.ref == 'refs/heads/main'
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Setup Go 1.25.x
        uses: actions/setup-go@v5
        with:
          # Semantic version range syntax or exact version of Go
          go-version: '1.25.x'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Go Vet
        run: |
          go vet ./...

      - name: Unit tests with coverage
        run: |
          mkdir -p coverage.covdata/unit
          PKG_LIST=$(go list ./... | grep -v '/examples/')
          PKGS=$(echo "$PKG_LIST" | paste -sd, -)
          go test -race -covermode=atomic -coverpkg=$PKGS $PKG_LIST -args -test.gocoverdir=$PWD/coverage.covdata/unit

      - name: Integration tests with coverage
        run: |
          mkdir -p coverage.covdata/integration
          PKGS=$(go list ./... | grep -v '/examples/' | paste -sd, -)
          go test -race -tags integration -covermode=atomic -coverpkg=$PKGS ./tests/integration/... -timeout 600s -args -test.gocoverdir=$PWD/coverage.covdata/integration

      - name: Merge coverage profiles
        run: |
          go tool covdata textfmt -i=coverage.covdata/unit,coverage.covdata/integration -o=coverage.out

#      - name: Upload coverage to Codecov
#        uses: codecov/codecov-action@v5
#        with:
#          # token: ${{ secrets.CODECOV_TOKEN }}
#          files: ./coverage.out

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Project metadata can be defined here or in a sonar-project.properties file
          args: >
            -Dsonar.projectKey=bancolombia_reactive-commons-go
            -Dsonar.organization=grupo-bancolombia
            -Dsonar.sources=.
            -Dsonar.coverage.exclusions=**/*_test.go,**/examples/**,tests/integration/kafka/interop/**
            -Dsonar.exclusions=**/*_test.go,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.qualitygate.wait=true
            -Dsonar.branch.name=${{ github.ref_name }}
