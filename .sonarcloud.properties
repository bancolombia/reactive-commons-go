# SonarQube Cloud automatic analysis configuration.
#
# Only the settings supported by automatic analysis are listed here. The
# following settings from the former CI-based scan are intentionally omitted
# because automatic analysis does not support them:
#   - sonar.go.coverage.reportPaths (code coverage is not supported)
#   - sonar.coverage.exclusions     (no coverage data to exclude)
#   - sonar.qualitygate.wait        (CI-only; the quality gate is reported as
#                                    a GitHub check by SonarQube Cloud)
#   - sonar.branch.name             (CI-only; branches/PRs are detected
#                                    automatically, non-PR branch analysis is
#                                    not supported)
#
# See https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

sonar.projectKey=bancolombia_reactive-commons-go
sonar.organization=grupo-bancolombia

# Path to sources
sonar.sources=.
sonar.exclusions=**/*_test.go,**/examples/**

# Path to tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go
